<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <title>Calculadora de Craft</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 900px;
        }

        section#calculadora {
            background: #020617;
            display: flex;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        #imagem {
            width: 45%;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #imagem img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            background: #ffffff;
            padding: 10px;
        }

        #formulario {
            width: 55%;
            padding: 30px;
            color: #e5e7eb;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .campo {
            display: flex;
            align-items: center;
            background: #020617;
            border: 1px solid #26313b;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
        }

        .campo span {
            color: #1678d3;
            margin-right: 8px;
        }

        .campo input,
        .campo select {
            background: transparent;
            border: none;
            outline: none;
            color: #e5e7eb;
            width: 100%;
            font-size: 15px;
        }

        .campo select option {
            color: black;
        }

        .enviar input {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #13145c;
            color: #d2d4db;
            font-size: 16px;
            cursor: pointer;
        }

        .enviar input:hover {
            background: #1618a3;
        }

        .resultado {
            margin-top: 20px;
            background: #020617;
            border: 1px solid #4d6072;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.8;
        }

        .titulo-resultado {
            font-size: 18px;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .material {
            padding: 4px 0;
        }

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            section#calculadora {
                flex-direction: column;
            }

            #imagem {
                width: 100%;
                height: 200px;
            }

            #formulario {
                width: 100%;
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<main>

    <section id="calculadora">

        <div id="imagem">
            <img src="fotos/dinastia.png" alt="DINASTIA">
        </div>

        <div id="formulario">

            <h1>Calculadora de Craft</h1>

            <p>
                <strong>Escolha o craft e informe a quantidade</strong>
            </p>

            <!-- TIPO DE CRAFT -->
            <div class="campo">

                <span class="material-symbols-outlined">
                    construction
                </span>

                <select id="craft">

                    <option value="">
                        Selecione o craft
                    </option>

                    <option value="uzi">
                        🔫 UZI
                    </option>

                    <option value="aug">
                        🔫 AUG
                    </option>

                    <option value="pecaMedia">
                        🛠️ Peça de Arma Média
                    </option>

                    <option value="parafuso">
                        🔩 Parafuso Pequeno
                    </option>

                </select>

            </div>

            <div id="quantidadesCraft" style="display: none; margin-bottom: 15px;">

    <div class="campo">
        <span class="material-symbols-outlined">build</span>
        <input type="text" id="pecasMedia" readonly>
    </div>

    <div class="campo">
        <span class="material-symbols-outlined">settings</span>
        <input type="text" id="parafusos" readonly>
    </div>

</div>

            <!-- QUANTIDADE -->

            <div class="campo">

                <span class="material-symbols-outlined">
                    inventory_2
                </span>

                <input
                    type="number"
                    id="qtd"
                    min="1"
                    placeholder="Quantidade"
                >

            </div>

            <!-- BOTÃO -->

            <div class="enviar">

                <input
                    type="button"
                    value="Calcular"
                    onclick="calcular()"
                >

            </div>

            <!-- RESULTADO -->

            <div
                class="resultado"
                id="resultado"
            >
                Selecione um craft e informe a quantidade.
            </div>

        </div>

    </section>

</main>


<script>

function formatar(numero) {

    return numero.toLocaleString("pt-BR");

}


function calcular() {

    const craft =
        document.getElementById("craft").value;

    const qtd =
        Number(document.getElementById("qtd").value);

    const resultado =
        document.getElementById("resultado");


    // VALIDAÇÃO

    if (!craft || !qtd || qtd <= 0) {

        resultado.innerHTML = `
            <span style="color:#f87171;">
                ❌ Selecione um craft e informe uma quantidade válida.
            </span>
        `;

        return;

    }


    let html = "";


    // =========================
    // UZI
    // =========================

    if (craft === "uzi") {

        const sujo = 500 * qtd;

        const pecaMedia = 2 * qtd;

        const parafuso = 3 * qtd;


        html = `

            <div class="titulo-resultado">
                🔫 UZI × ${formatar(qtd)}
            </div>

            <strong>Materiais necessários:</strong>

            <div class="material">
                🩸 Sujo: <strong>${formatar(sujo)}x</strong>
            </div>

            <div class="material">
                🛠️ Peças de Arma Média:
                <strong>${formatar(pecaMedia)}x</strong>
            </div>

            <div class="material">
                🔩 Parafusos Pequenos:
                <strong>${formatar(parafuso)}x</strong>
            </div>

        `;

    }


    // =========================
    // AUG
    // =========================

    else if (craft === "aug") {

        const sujo = 500 * qtd;

        const pecaMedia = 4 * qtd;

        const parafuso = 3 * qtd;


        html = `

            <div class="titulo-resultado">
                🔫 AUG × ${formatar(qtd)}
            </div>

            <strong>Materiais necessários:</strong>

            <div class="material">
                🩸 Sujo: <strong>${formatar(sujo)}x</strong>
            </div>

            <div class="material">
                🛠️ Peças de Arma Média:
                <strong>${formatar(pecaMedia)}x</strong>
            </div>

            <div class="material">
                🔩 Parafusos Pequenos:
                <strong>${formatar(parafuso)}x</strong>
            </div>

        `;

    }


    // =========================
    // PEÇA DE ARMA MÉDIA
    // =========================

    else if (craft === "pecaMedia") {

        const borracha = 30 * qtd;

        const vidro = 30 * qtd;

        const cobre = 30 * qtd;

        const aluminio = 30 * qtd;

        const corpoSub = 1 * qtd;

        const pecaArma = 1 * qtd;

        const sujo = 1000 * qtd;


        html = `

            <div class="titulo-resultado">
                🛠️ Peça de Arma Média × ${formatar(qtd)}
            </div>

            <strong>Materiais necessários:</strong>

            <div class="material">
                🛞 Borrachas:
                <strong>${formatar(borracha)}x</strong>
            </div>

            <div class="material">
                🪟 Vidro:
                <strong>${formatar(vidro)}x</strong>
            </div>

            <div class="material">
                🔩 Cobre:
                <strong>${formatar(cobre)}x</strong>
            </div>

            <div class="material">
                ⚙️ Alumínio:
                <strong>${formatar(aluminio)}x</strong>
            </div>

            <div class="material">
                🔧 Corpo de Sub:
                <strong>${formatar(corpoSub)}x</strong>
            </div>

            <div class="material">
                🔫 Peças de Arma:
                <strong>${formatar(pecaArma)}x</strong>
            </div>

            <div class="material">
                🩸 Sujo:
                <strong>${formatar(sujo)}x</strong>
            </div>

        `;

    }


    // =========================
    // PARAFUSO PEQUENO
    // =========================

    else if (craft === "parafuso") {

        const barraFerro = 3 * qtd;

        const sujo = 300 * qtd;


        html = `

            <div class="titulo-resultado">
                🔩 Parafuso Pequeno × ${formatar(qtd)}
            </div>

            <strong>Materiais necessários:</strong>

            <div class="material">
                ⚙️ Barra de Ferro:
                <strong>${formatar(barraFerro)}x</strong>
            </div>

            <div class="material">
                🩸 Sujo:
                <strong>${formatar(sujo)}x</strong>
            </div>

        `;

    }
    // =========================
// UZI
// =========================

if (craft === "uzi") {

    const sujo = 500 * qtd;
    const pecaMedia = 2 * qtd;
    const parafuso = 3 * qtd;

    const valorLimpo = 40000 * qtd;
    const valorSujo = 52000 * qtd;

    html = `

        <div class="titulo-resultado">
            🔫 UZI × ${formatar(qtd)}
        </div>

        <strong>Materiais necessários:</strong>

        <div class="material">
            🩸 Sujo: <strong>${formatar(sujo)}x</strong>
        </div>

        <div class="material">
            🛠️ Peças de Arma Média:
            <strong>${formatar(pecaMedia)}x</strong>
        </div>

        <div class="material">
            🔩 Parafusos Pequenos:
            <strong>${formatar(parafuso)}x</strong>
        </div>

        <br>

        <strong>💰 Valor da UZI:</strong>

        <div class="material">
            💵 Limpo:
            <strong>R$ ${formatar(valorLimpo)}</strong>
        </div>

        <div class="material">
            🩸 Sujo:
            <strong>R$ ${formatar(valorSujo)}</strong>
        </div>

    `;

}


// =========================
// AUG
// =========================

else if (craft === "aug") {

    const sujo = 500 * qtd;
    const pecaMedia = 4 * qtd;
    const parafuso = 3 * qtd;

    const valorLimpo = 160000 * qtd;
    const valorSujo = 208000 * qtd;

    html = `

        <div class="titulo-resultado">
            🔫 AUG × ${formatar(qtd)}
        </div>

        <strong>Materiais necessários:</strong>

        <div class="material">
            🩸 Sujo: <strong>${formatar(sujo)}x</strong>
        </div>

        <div class="material">
            🛠️ Peças de Arma Média:
            <strong>${formatar(pecaMedia)}x</strong>
        </div>

        <div class="material">
            🔩 Parafusos Pequenos:
            <strong>${formatar(parafuso)}x</strong>
        </div>

        <br>

        <strong>💰 Valor da AUG:</strong>

        <div class="material">
            💵 Limpo:
            <strong>R$ ${formatar(valorLimpo)}</strong>
        </div>

        <div class="material">
            🩸 Sujo:
            <strong>R$ ${formatar(valorSujo)}</strong>
        </div>

    `;


    const craftSelect = document.getElementById("craft");
const qtdInput = document.getElementById("qtd");

function atualizarCrafts() {

    const craft = craftSelect.value;
    const qtd = Number(qtdInput.value);

    const caixa = document.getElementById("quantidadesCraft");
    const pecasMedia = document.getElementById("pecasMedia");
    const parafusos = document.getElementById("parafusos");

    // Só aparece para UZI e AUG
    if ((craft === "uzi" || craft === "aug") && qtd > 0) {

        let quantidadeMedia = 0;
        let quantidadeParafuso = 3 * qtd;

        if (craft === "uzi") {
            quantidadeMedia = 2 * qtd;
        }

        if (craft === "aug") {
            quantidadeMedia = 4 * qtd;
        }

        pecasMedia.value =
            `Peças de Arma Média: ${quantidadeMedia}x`;

        parafusos.value =
            `Parafusos Pequenos: ${quantidadeParafuso}x`;

        caixa.style.display = "block";

    } else {

        caixa.style.display = "none";

    }
}

craftSelect.addEventListener("change", atualizarCrafts);
qtdInput.addEventListener("input", atualizarCrafts);
}


    resultado.innerHTML = html;

}

</script>

</body>
</html>
