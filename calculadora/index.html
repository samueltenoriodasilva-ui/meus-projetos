<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <title>Calculadora de Produção</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        main {
            width: 100%;
            max-width: 1000px;
        }

        section#calculadora {
            background: #020617;
            display: flex;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        /* IMAGEM */

        #imagem {
            width: 40%;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #imagem img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
            background-color: #ffffff;
            padding: 10px;
        }

        /* FORMULÁRIO */

        #formulario {
            width: 60%;
            padding: 30px;
            color: #e5e7eb;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            font-size: 14px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* CAMPOS */

        .campo {
            display: flex;
            align-items: center;
            background: #020617;
            border: 1px solid #26313b;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
        }

        .campo span {
            color: #1678d3;
            margin-right: 8px;
        }

        .campo input {
            background: transparent;
            border: none;
            outline: none;
            color: #e5e7eb;
            width: 100%;
            font-size: 15px;
        }

        /* BOTÃO */

        .enviar input {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #13145c;
            color: #d2d4db;
            font-size: 16px;
            cursor: pointer;
        }

        .enviar input:hover {
            background: #1618a3;
        }

        /* RESULTADO */

        .resultado {
            margin-top: 20px;
            background: #020617;
            border: 1px solid #4d6072;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            line-height: 1.8;
        }

        .titulo-resultado {
            font-size: 19px;
            color: #60a5fa;
            margin-bottom: 12px;
        }

        .secao {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #26313b;
        }

        .material {
            padding: 3px 0;
        }

        .valor {
            color: #22c55e;
        }

        .sujo {
            color: #f87171;
        }

        /* RESPONSIVO */

        @media (max-width: 768px) {

            body {
                padding: 10px;
            }

            section#calculadora {
                flex-direction: column;
            }

            #imagem {
                width: 100%;
                height: 200px;
            }

            #formulario {
                width: 100%;
                padding: 25px 20px;
            }
        }

    </style>
</head>

<body>

<main>

    <section id="calculadora">

        <!-- IMAGEM -->

        <div id="imagem">

            <img
                src="fotos/dinastia.png"
                alt="DINASTIA"
            >

        </div>


        <!-- FORMULÁRIO -->

        <div id="formulario">

            <h1>Calculadora de Produção</h1>

            <p>
                <strong>UZI + AUG + Materiais</strong>
            </p>


            <!-- UZI -->

            <div class="campo">

                <span class="material-symbols-outlined">
                    inventory_2
                </span>

                <input
                    type="number"
                    id="qtdUzi"
                    min="0"
                    placeholder="Quantidade de UZI"
                    oninput="atualizarPrevia()"
                >

            </div>


            <!-- AUG -->

            <div class="campo">

                <span class="material-symbols-outlined">
                    inventory_2
                </span>

                <input
                    type="number"
                    id="qtdAug"
                    min="0"
                    placeholder="Quantidade de AUG"
                    oninput="atualizarPrevia()"
                >

            </div>


            <!-- PRÉVIA DOS CRAFTS -->

            <div
                id="previa"
                style="
                    display:none;
                    background:#020617;
                    border:1px solid #26313b;
                    border-radius:8px;
                    padding:12px;
                    margin-bottom:15px;
                    line-height:1.8;
                "
            ></div>


            <!-- BOTÃO -->

            <div class="enviar">

                <input
                    type="button"
                    value="Calcular Produção"
                    onclick="calcular()"
                >

            </div>


            <!-- RESULTADO -->

            <div
                class="resultado"
                id="resultado"
            >
                Informe a quantidade de UZI e/ou AUG.
            </div>

        </div>

    </section>

</main>


<script>

function formatar(numero) {
    return numero.toLocaleString("pt-BR");
}

function calcularProducao(qtdUzi, qtdAug) {

    // Craft direto das armas
    const pecasArmaMedia = (qtdUzi * 2) + (qtdAug * 4);
    const parafusosPequenos = (qtdUzi * 3) + (qtdAug * 3);

    // Receita de 1 Peça de Arma Média
    const receitaPecaMedia = {
        borracha: 30,
        vidro: 30,
        cobre: 30,
        aluminio: 30,
        corpoSub: 1,
        pecaArma: 1,
        sujo: 1000
    };

    // Total para as Peças de Arma Média
    const borracha = pecasArmaMedia * receitaPecaMedia.borracha;
    const vidro = pecasArmaMedia * receitaPecaMedia.vidro;
    const cobre = pecasArmaMedia * receitaPecaMedia.cobre;
    const aluminio = pecasArmaMedia * receitaPecaMedia.aluminio;
    const corpoSub = pecasArmaMedia * receitaPecaMedia.corpoSub;
    const pecaArma = pecasArmaMedia * receitaPecaMedia.pecaArma;
    const sujoPecas = pecasArmaMedia * receitaPecaMedia.sujo;

    // Receita de 1 Parafuso Pequeno
    const receitaParafuso = {
        barraFerro: 3,
        sujo: 300
    };

    // Total para os Parafusos Pequenos
    const barraFerro = parafusosPequenos * receitaParafuso.barraFerro;
    const sujoParafusos = parafusosPequenos * receitaParafuso.sujo;

    // Sujo das armas
    const sujoArmas = (qtdUzi + qtdAug) * 500;

    // Sujo total da produção
    const sujoTotal = sujoArmas + sujoPecas + sujoParafusos;

    return {
        qtdUzi,
        qtdAug,
        pecasArmaMedia,
        parafusosPequenos,
        receitaPecaMedia,
        receitaParafuso,
        borracha,
        vidro,
        cobre,
        aluminio,
        corpoSub,
        pecaArma,
        barraFerro,
        sujoArmas,
        sujoPecas,
        sujoParafusos,
        sujoTotal
    };
}

function atualizarPrevia() {

    const qtdUzi = Number(document.getElementById("qtdUzi").value) || 0;
    const qtdAug = Number(document.getElementById("qtdAug").value) || 0;
    const previa = document.getElementById("previa");

    if (qtdUzi <= 0 && qtdAug <= 0) {
        previa.style.display = "none";
        return;
    }

    const p = calcularProducao(qtdUzi, qtdAug);

    previa.style.display = "block";

    previa.innerHTML = `
        <strong style="color:#60a5fa;">📦 Crafts necessários</strong>
        <br><br>

        🔫 UZI:
        <strong>${formatar(qtdUzi)}x</strong>
        <br>

        🔫 AUG:
        <strong>${formatar(qtdAug)}x</strong>
        <br><br>

        🛠️ Peças de Arma Média:
        <strong>${formatar(p.pecasArmaMedia)}x</strong>
        <br>

        🔩 Parafusos Pequenos:
        <strong>${formatar(p.parafusosPequenos)}x</strong>
    `;
}

function calcular() {

    const qtdUzi = Number(document.getElementById("qtdUzi").value) || 0;
    const qtdAug = Number(document.getElementById("qtdAug").value) || 0;
    const resultado = document.getElementById("resultado");

    if (qtdUzi <= 0 && qtdAug <= 0) {
        resultado.innerHTML = `
            <span style="color:#f87171;">
                ❌ Informe pelo menos uma UZI ou uma AUG.
            </span>
        `;
        return;
    }

    const p = calcularProducao(qtdUzi, qtdAug);

    // Valores das armas
    const valorUziLimpo = qtdUzi * 40000;
    const valorUziSujo = qtdUzi * 52000;

    const valorAugLimpo = qtdAug * 160000;
    const valorAugSujo = qtdAug * 208000;

    const valorTotalLimpo = valorUziLimpo + valorAugLimpo;
    const valorTotalSujo = valorUziSujo + valorAugSujo;

    resultado.innerHTML = `

        <div class="titulo-resultado">
            📊 Resultado da Produção
        </div>

        <strong>🔫 Armas</strong>

        <div class="material">
            UZI: <strong>${formatar(qtdUzi)}x</strong>
        </div>

        <div class="material">
            AUG: <strong>${formatar(qtdAug)}x</strong>
        </div>

        <div class="secao">
            <strong>💰 Valor das Armas</strong>

            ${qtdUzi > 0 ? `
                <div class="material">
                    UZI — 💵 Limpo:
                    <span class="valor">R$ ${formatar(valorUziLimpo)}</span>
                </div>

                <div class="material">
                    UZI — 🩸 Sujo:
                    <span class="sujo">R$ ${formatar(valorUziSujo)}</span>
                </div>
            ` : ""}

            ${qtdAug > 0 ? `
                <div class="material">
                    AUG — 💵 Limpo:
                    <span class="valor">R$ ${formatar(valorAugLimpo)}</span>
                </div>

                <div class="material">
                    AUG — 🩸 Sujo:
                    <span class="sujo">R$ ${formatar(valorAugSujo)}</span>
                </div>
            ` : ""}
        </div>

        <div class="secao">
            <strong>🛠️ Crafts Necessários</strong>

            <div class="material">
                Peças de Arma Média:
                <strong>${formatar(p.pecasArmaMedia)}x</strong>
            </div>

            <div class="material">
                Parafusos Pequenos:
                <strong>${formatar(p.parafusosPequenos)}x</strong>
            </div>
        </div>

        <div class="secao">
            <strong>🛠️ Para fazer 1 Peça de Arma Média:</strong>

            <div class="material">🛞 30x Borrachas</div>
            <div class="material">🪟 30x Vidro</div>
            <div class="material">🔩 30x Cobre</div>
            <div class="material">⚙️ 30x Alumínio</div>
            <div class="material">🔧 1x Corpo de Sub</div>
            <div class="material">🔫 1x Peça de Arma</div>
            <div class="material">🩸 1000x Sujo</div>
        </div>

        <div class="secao">
            <strong>
                📦 Total para ${formatar(p.pecasArmaMedia)}
                Peças de Arma Média:
            </strong>

            <div class="material">
                🛞 Borrachas:
                <strong>${formatar(p.borracha)}x</strong>
            </div>

            <div class="material">
                🪟 Vidro:
                <strong>${formatar(p.vidro)}x</strong>
            </div>

            <div class="material">
                🔩 Cobre:
                <strong>${formatar(p.cobre)}x</strong>
            </div>

            <div class="material">
                ⚙️ Alumínio:
                <strong>${formatar(p.aluminio)}x</strong>
            </div>

            <div class="material">
                🔧 Corpo de Sub:
                <strong>${formatar(p.corpoSub)}x</strong>
            </div>

            <div class="material">
                🔫 Peças de Arma:
                <strong>${formatar(p.pecaArma)}x</strong>
            </div>

            <div class="material">
                🩸 Sujo:
                <strong>${formatar(p.sujoPecas)}</strong>
            </div>
        </div>

        <div class="secao">
            <strong>🔩 Para fazer 1 Parafuso Pequeno:</strong>

            <div class="material">⚙️ 3x Barras de Ferro</div>
            <div class="material">🩸 300x Sujo</div>
        </div>

        <div class="secao">
            <strong>
                📦 Total para ${formatar(p.parafusosPequenos)}
                Parafusos Pequenos:
            </strong>

            <div class="material">
                ⚙️ Barras de Ferro:
                <strong>${formatar(p.barraFerro)}x</strong>
            </div>

            <div class="material">
                🩸 Sujo:
                <strong>${formatar(p.sujoParafusos)}</strong>
            </div>
        </div>

        <div class="secao">
            <strong>🩸 Dinheiro Sujo Necessário</strong>

            <div class="material">
                Sujo das armas:
                <strong>${formatar(p.sujoArmas)}</strong>
            </div>

            <div class="material">
                Sujo das Peças de Arma Média:
                <strong>${formatar(p.sujoPecas)}</strong>
            </div>

            <div class="material">
                Sujo dos Parafusos:
                <strong>${formatar(p.sujoParafusos)}</strong>
            </div>

            <br>

            <div class="material">
                <strong>
                    🩸 TOTAL DE SUJO:
                    ${formatar(p.sujoTotal)}
                </strong>
            </div>
        </div>

        <div class="secao">
            <strong>💰 Total de Venda das Armas</strong>

            <div class="material">
                💵 Total Limpo:
                <span class="valor">
                    <strong>R$ ${formatar(valorTotalLimpo)}</strong>
                </span>
            </div>

            <div class="material">
                🩸 Total Sujo:
                <span class="sujo">
                    <strong>R$ ${formatar(valorTotalSujo)}</strong>
                </span>
            </div>
        </div>
    `;
}

</script>

</body>
</html>
